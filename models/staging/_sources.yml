version: 2

sources:
  - name: jaffle_shop
    database: jaffle_shop
    schema: raw
    description: E-commerce data for the Jaffle Shop
    tables:
      - name: raw_customers
        description: One record per person who has purchased one or more items
      - name: raw_orders
        description: One record per order (consisting of one or more order items)
        columns:
          - name: id
            description: The unique id for each order.
          - name: customer
            description: The unique id for each customer.
          - name: ordered_at
            description: The timestamp when the order was placed.
          - name: store_id
            description: The unique id for each store that the sale took place in.
          - name: subtotal
            description: The subtotal of the order in cents.
          - name: tax_paid
            description: The tax paid on the order in cents.
          - name: order_total
            description: The total amount of the order in cents.
        loaded_at_field: ordered_at
      - name: raw_items
        description: Items included in an order
      - name: raw_stores
        loaded_at_field: opened_at
      - name: raw_products
        description: One record per SKU for items sold in stores
      - name: raw_supplies
        description: One record per supply per SKU of items sold in stores