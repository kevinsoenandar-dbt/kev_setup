# dbt profile - sensitive values from environment variables
# Set these in GitHub: Settings → Secrets and variables → Actions
# Variables: SNOWFLAKE_ACCOUNT, SNOWFLAKE_DATABASE, SNOWFLAKE_WAREHOUSE, SNOWFLAKE_SCHEMA, SNOWFLAKE_ROLE
# Secrets: SNOWFLAKE_USERNAME, SNOWFLAKE_PASSWORD
# For local dev: export SNOWFLAKE_ACCOUNT=..., SNOWFLAKE_USERNAME=..., etc.

kev_setup:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USERNAME') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      threads: 4